# Serve o painel dentro do contêiner (o HTTPS fica no Nginx da VPS).
# Os cabeçalhos de segurança se repetem em cada bloco porque, no Nginx,
# um add_header dentro de "location" anula os que estão fora dele.
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # arquivos com hash no nome podem ficar em cache por muito tempo
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
  }

  # o index.html nunca fica em cache, para as atualizações aparecerem na hora
  location = /index.html {
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
  }

  # painel, /acompanhar/<código>, /privacidade/<cidade> e /termos/<cidade>/... são a mesma página
  location / {
    try_files $uri /index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
  }
}
