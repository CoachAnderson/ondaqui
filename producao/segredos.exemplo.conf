# Configuração do OnDaqui em produção.
# O script ./ondaqui.sh instalar cria o arquivo segredos.conf com senhas novas a partir deste modelo.
# NUNCA envie o segredos.conf para o GitHub nem para outras pessoas.

# Endereços (crie os registros A no DNS da Hostinger apontando para o IP da VPS)
PAINEL_DOMINIO=painel.ondaqui.com.br
API_DOMINIO=api.ondaqui.com.br

# Portas internas na VPS (só acessíveis pela própria VPS). Mude se já estiverem em uso.
API_PORTA=3340
PAINEL_PORTA=3341

# Senhas (geradas automaticamente pelo instalador)
POSTGRES_PASSWORD=
JWT_SECRET=

# Chave que protege os tokens do Mercado Pago no banco (gerada pelo instalador).
# NUNCA troque depois de conectar contas: os tokens guardados deixariam de abrir.
ENCRYPTION_KEY=

# Mercado Pago da PLATAFORMA (recebe as faturas dos licenciados).
# Configure com: sudo ./ondaqui.sh mercadopago
# Webhook a cadastrar no Mercado Pago: https://API_DOMINIO/webhooks/mercadopago/plataforma (evento Pagamentos)
MP_ACCESS_TOKEN=
MP_WEBHOOK_SECRET=
# Dias de atraso da fatura para suspender a cidade automaticamente (0 = nunca)
BILLING_SUSPEND_AFTER_DAYS=15
# Dia do mês em que a fatura vence (1 a 28)
INVOICE_DUE_DAY=10

# Notificações push: expo (envia de verdade) ou off
PUSH_MODE=expo
EXPO_ACCESS_TOKEN=

# Códigos por SMS ou WhatsApp (confirmar celular no cadastro e "Esqueci minha senha")
#   twilio  = Twilio (SMS; para WhatsApp use TWILIO_FROM=whatsapp:+55...)
#   webhook = a API faz POST {phone, message, code, tenant} em SMS_WEBHOOK_URL (Zenvia, Z-API, Evolution...)
#   log     = só escreve no log (sem envio de verdade)
SMS_PROVIDER=log
TWILIO_ACCOUNT_SID=
TWILIO_AUTH_TOKEN=
TWILIO_FROM=
SMS_WEBHOOK_URL=
SMS_WEBHOOK_TOKEN=
# Exigir o código no cadastro: on depois de configurar o envio acima; off enquanto não houver envio
PHONE_VERIFICATION=off
# Empresa dona da tecnologia (aparece como operadora na política de privacidade)
PLATFORM_LEGAL_NAME=OnDaqui Tecnologia
PLATFORM_CNPJ=44.607.634/0001-82

# Quantos dias de backup guardar
BACKUP_MANTER_DIAS=14
