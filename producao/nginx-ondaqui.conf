# OnDaqui — sites no Nginx da VPS (gerado pelo ./ondaqui.sh a partir deste modelo).
# Depois do certbot, este arquivo ganha as linhas do HTTPS automaticamente.

# Painel da central, painel master e página "acompanhe a corrida"
server {
    listen 80;
    listen [::]:80;
    server_name __PAINEL_DOMINIO__;

    location / {
        proxy_pass http://127.0.0.1:__PAINEL_PORTA__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# API usada pelos apps e pelo painel (inclui o tempo real por WebSocket)
server {
    listen 80;
    listen [::]:80;
    server_name __API_DOMINIO__;

    # a selfie do motorista pode ter até 4 MB
    client_max_body_size 5m;

    location / {
        proxy_pass http://127.0.0.1:__API_PORTA__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
